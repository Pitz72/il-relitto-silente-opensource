# Le prove del remake, su GitHub (revisione 25, G5; sviluppo/STRUTTURA.md per i comandi).
#
# Partono a ogni push su main e a ogni pull request che tocca il gioco o l'app (non per i soli
# documenti), a mano dalla scheda Actions, e prima di ogni rilascio (rilascio.yml le chiama: un tag
# su un commit rotto non diventa un installer). Sono le stesse che si lanciano in locale:
#
#   il motore audio e l'app   cargo test, le 17 partite rese dal motore audio, i riconoscimenti,
#                             le versioni (su Windows, la piattaforma provata)
#   il gioco                  le prove in node e i collaudi in Python e in node: regressioni,
#                             pulsanti, menu, eventi, diario, scritti, salvataggi, tipografia
#
# Restano fuori le prove dentro l'eseguibile (strumenti/prova_eseguibile.py: finali, salvataggi,
# mondo), che aprono una finestra e il dispositivo audio: si fanno in locale, prima di ogni consegna.
name: Prove

# Il CHANGELOG entra nel gioco (la finestra delle novità legge le righe «Per chi gioca»): un cambio al solo
# CHANGELOG fa partire le prove, gli altri documenti no (revisione 37, L30).
on:
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "!progettazione/**", "!grafica/**", "!old_version/**", "!consegne/**", "CHANGELOG.md"]
  pull_request:
    paths: ["**", "!**/*.md", "!progettazione/**", "!grafica/**", "!old_version/**", "!consegne/**", "CHANGELOG.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Un push nuovo annulla le prove del push di prima; le prove chiamate dal rilascio non si annullano mai. Dentro un
# flusso chiamato `github.event_name` è l'evento di chi chiama (il push del tag), non «workflow_call»: la condizione
# di prima non scattava mai (revisione 37, L30). `github.workflow` invece è il nome del flusso che ha cominciato:
# «Prove» qui, «Rilascio» quando le chiama il rilascio.
concurrency:
  group: prove-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Prove' }}

jobs:
  motore-audio:
    name: Il motore audio e l'app (Windows)
    runs-on: windows-latest
    env:
      # le prove girano nel profilo di rilascio (il suono è lento senza ottimizzazioni), ma senza
      # LTO e con più unità di compilazione: si costruisce in pochi minuti invece che in mezz'ora
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: lark, dalla ruota del repository (la stessa che usa l'app)
        run: python -m pip install app/vendor/lark-1.3.1-py3-none-any.whl
      # fissata all'impronta (revisione 25, L14): con l'impronta il canale va detto a parte
      # il compilatore è fissato alla versione con cui il gioco si prova in locale (revisione 37, L30): con «stable»
      # l'eseguibile pubblicato nasceva con il compilatore del giorno. Si alza qui e in rilascio.yml insieme, dopo aver
      # rifatto le prove in locale con la versione nuova
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: "1.95.0" }
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "app/src-tauri -> target" }
      - name: L'app (la pagina serve anche a cargo, che la incorpora)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --lib --release
      - name: Le 17 partite nel motore audio
        env:
          # in locale si chiede di stare 5 volte dentro il tempo reale; qui la macchina è condivisa e
          # compilata senza LTO, e ci arriva a fatica: basta che il suono resti dentro il tempo reale
          RELITTO_VELOCITA_MINIMA: "1.5"
        run: |
          python strumenti/audio/traccia.py --tutti
          cd app/src-tauri
          cargo run --release --example prova_partite -- ../../collaudo/tracce
      - name: I riconoscimenti e le versioni
        run: |
          python strumenti/riconoscimenti.py --verifica
          node strumenti/versione.mjs verifica

  gioco:
    name: Il gioco (prove e collaudi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: lark, dalla ruota del repository
        run: python -m pip install app/vendor/lark-1.3.1-py3-none-any.whl
      - name: Le prove in node
        working-directory: app
        run: |
          npm ci
          npm run prove
      - name: Le regressioni (i 17 percorsi, con le riprese)
        run: python collaudo/regressioni.py --riprese
      - name: I pulsanti
        run: python collaudo/pulsanti.py
      - name: I menu del modello d'azione
        run: node collaudo/menu.mjs
      - name: Gli eventi del suono
        run: python collaudo/eventi.py
      - name: Il diario
        run: python collaudo/diario.py
      - name: I comandi scritti
        run: python collaudo/scritti.py
      - name: I salvataggi
        run: python collaudo/salvataggi.py
      - name: La tipografia
        run: |
          node collaudo/tipografia.mjs
          node collaudo/tipografia.mjs --solo-testo
