# Il rilascio del remake (documento 06, fase 9; sviluppo/VERSIONI.md, §2.1 e §7).
#
# Parte quando si spinge un tag `v` + versione (per esempio v0.9.0 o v1.0.0-rc.1). Il tag è la versione:
# `versione.json` deve dire lo stesso numero, e il CHANGELOG deve avere la sua sezione datata. Lancia le
# prove (prove.yml); se passano costruisce Windows (installer NSIS) e, quando l'autore l'ha provato e ha
# acceso la variabile LINUX_PROVATO, Linux (.deb, AppImage); firma i pacchetti dell'aggiornamento automatico con
# la chiave privata dei Secrets e prepara una release in BOZZA con il suo `latest.json`: l'autore la guarda
# e la pubblica a mano: allora canale.yml copia il latest.json nel canale degli aggiornamenti, che i giochi
# installati leggono (finché è bozza nessuno la vede). Vedi sviluppo/VERSIONI.md, §7.
#
# Prima volta: nei Secrets del repository (Settings → Secrets and variables → Actions) va il contenuto del
# file della chiave privata come `TAURI_SIGNING_PRIVATE_KEY` e la sua password come
# `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`; la chiave pubblica va in app/src-tauri/tauri.conf.json. Come si
# fa la chiave, con la password: sviluppo/VERSIONI.md, §7 (revisione 25, G4).
# Non provato su GitHub finché non c'è il primo tag: sviluppo/VERSIONI.md, §7.
name: Rilascio

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Il tag è la versione
        run: |
          node strumenti/versione.mjs verifica --rilascio
          V=$(node -p "require('./versione.json').gioco")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Il tag ${GITHUB_REF_NAME} non è la versione v$V di versione.json"; exit 1; }

  # le stesse prove di ogni push (prove.yml): un tag su un commit rotto non diventa un installer
  prove:
    uses: ./.github/workflows/prove.yml

  costruisci:
    needs: [controllo, prove]
    strategy:
      fail-fast: false
      matrix:
        # Linux solo quando l'autore l'ha provato su una macchina vera (revisione 25, G5): allora
        # imposta la variabile del repository LINUX_PROVATO a true (Settings → Secrets and
        # variables → Actions → Variables). Fino ad allora il rilascio è solo per Windows.
        sistema: ${{ fromJSON(vars.LINUX_PROVATO == 'true' && '["windows-latest", "ubuntu-22.04"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "app/src-tauri -> target" }
      - name: Le librerie di Linux
        if: matrix.sistema == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev patchelf
      - run: npm ci
        working-directory: app
      # il corpo della release: le righe «Per chi gioca» del CHANGELOG. tauri-action lo scrive anche
      # nel latest.json («notes»), e il gioco installato le mostra nella domanda «È uscita la
      # versione…» (nota dell'autore del 19 ottobre 2026; revisione 25, L15)
      - name: Le note per chi gioca
        id: note
        shell: bash
        run: |
          {
            echo "corpo<<FINE_DELLE_NOTE"
            node strumenti/versione.mjs corpo
            echo "FINE_DELLE_NOTE"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Il Relitto Silente (remake) ${{ github.ref_name }}"
          releaseBody: ${{ steps.note.outputs.corpo }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # una pre-release (v…-beta.1) legge il canale di prova: tauri.prova.conf.json (canale.yml)
          args: --config src-tauri/tauri.rilascio.conf.json ${{ contains(github.ref_name, '-') && '--config src-tauri/tauri.prova.conf.json' || '' }}
