[package]
name = "il-relitto-silente"
version = "0.1.0"
description = "Il Relitto Silente — avventura testuale, app desktop"
authors = ["Simone Pizzi"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "relitto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kira = "0.12"

# Su Linux l'audio passa da ALSA con il dispositivo fissato all'avvio (audio.rs).
# Il protocollo PulseAudio di cpal (Rust puro, nessuna libreria di sistema) resta
# compilato per il confronto sulla macchina vera: RELITTO_AUDIO_HOST=pulseaudio.
# Vedi progettazione/08-fase-1-prova-tecnica.md. La feature si somma al cpal di kira.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
