[package]
name = "il-relitto-silente"
version = "0.1.0"
description = "Il Relitto Silente — avventura testuale, app desktop"
authors = ["Simone Pizzi"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "relitto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kira = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
